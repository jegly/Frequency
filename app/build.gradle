plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.jegly.frequency'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.jegly.frequency"
        minSdk = 33
        targetSdk = 37
        versionCode = 5
        versionName = "0.2.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    sourceSets {
        main {
            java {
                // Completely ignore all old Java files to prevent conflicts and warnings
                exclude '**/*.java'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
        buildConfig = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    // Adaptive Dependencies
    implementation 'androidx.compose.material3.adaptive:adaptive:1.3.0'
    implementation 'androidx.compose.material3.adaptive:adaptive-layout:1.3.0'
    implementation 'androidx.compose.material3.adaptive:adaptive-navigation:1.3.0'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite:1.4.0'

    implementation 'androidx.compose.material:material-icons-extended'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.10.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Splash screen
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // Biometric
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'

    // Media
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    ksp 'com.github.bumptech.glide:ksp:5.0.9'
    implementation 'com.github.bumptech.glide:compose:1.0.0-beta01'

    implementation 'com.google.android.material:material:1.14.0'

    // AppCompatActivity needs >= 1.7.1 for NavigationEventDispatcherOwner support,
    // required by navigation-compose 2.9+. Otherwise NavHost crashes at startup.
    implementation 'androidx.appcompat:appcompat:1.8.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.09.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
