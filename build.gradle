buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        mavenCentral()
    }
    // Build-tool transitives flagged by Dependabot; lifted to patched releases (never shipped in the APK).
    dependencies {
        constraints {
            classpath "io.netty:netty-buffer:4.2.19.Final"
            classpath "io.netty:netty-codec:4.2.19.Final"
            classpath "io.netty:netty-codec-http:4.2.19.Final"
            classpath "io.netty:netty-codec-http2:4.2.19.Final"
            classpath "io.netty:netty-common:4.2.19.Final"
            classpath "io.netty:netty-handler:4.2.19.Final"
            classpath "io.netty:netty-handler-proxy:4.2.19.Final"
            classpath "io.netty:netty-resolver:4.2.19.Final"
            classpath "io.netty:netty-transport:4.2.19.Final"
            classpath "io.netty:netty-transport-native-epoll:4.2.19.Final"
            classpath "org.bouncycastle:bcprov-jdk18on:1.86"
            classpath "org.bouncycastle:bcpkix-jdk18on:1.86"
            classpath "org.jdom:jdom2:2.0.6.1"
            classpath "org.bitbucket.b_c:jose4j:0.9.7"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // KSP replaces kapt for the Glide annotation processor so the app module
        // can drop 'org.jetbrains.kotlin.android' and use AGP's built-in Kotlin.
        classpath 'com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.12'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
